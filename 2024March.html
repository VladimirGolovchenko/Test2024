		<!-- Загрузка выбранного кода виджета (опционально, если мультиязычный сайт, либо по разным кнопка нужно открывать разные чаты с разными конфигурациями) -->
		<script>
		  function myfunc(widgetId) {
		    if (window.jivo_destroy) {
		      window.jivo_destroy();
		    }
		    var url = '//code.jivo.ru/widget/' + widgetId;
		    var headTag = document.getElementsByTagName("head")[0];
		    var jqTag = document.createElement('script');
		    jqTag.async = true;
		    jqTag.src = url;
		    headTag.appendChild(jqTag);
		  }
		</script>
		
		<script>
		//  Коллбэк функция при успешной инициализации и загрузки всех данных виджета
		function jivo_onLoadCallback() {
		 
		   //скрываем стандартную кнопку Jivo
		   const jivo_custom_widget = true;
		 
		   jivo_api.setUserToken("eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpZCI6IjEifQ.uQG6TM4G9Qz_o0sBvdYIQ7tVMQpONtlnhGyN8vLolSA");
		   
		 
		   //проверяем режим работы чата онлайн/оффлайн
		   let chatMode = jivo_api.chatMode();
		   if (chatMode === 'offline') {
		      //открываем чат для оффлайн режима (текст приветствия берётся из настроек раздела Дизайн, в кабинете Jivo)
		      jivo_api.open();
		   } else {
		      // открываем чат с активным приглашением для онлайн режима
		      // jivo_api.open();
		      jivo_api.showProactiveInvitation("Добрый день, приветствую на сайте нашей компании!");
		   }
		}
		</script>

		}
		</script>
		
		<!-- Показываем кастомную кнопку при закрытии чата -->
		<script>
		function jivo_onClose() {
		 jivo_custom_widget.style.display = 'block';
		 jivo_custom_widget_2.style.display = 'block';
		}
		</script>
